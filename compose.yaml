services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: campusfind
      POSTGRES_USER: campusfind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - campusfind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfind -d campusfind"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  campusfind_pg:
